<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Neko Studio — código do Mercado Livre</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      code {
        display: block;
        padding: 0.75rem;
        background: #f2f2f2;
        border-radius: 0.5rem;
        word-break: break-all;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.5rem 1rem;
      }
    </style>
  </head>
  <body>
    <!--
      Página de retorno do OAuth do ML (ADR 0005 §3.3). Não envia nada a lugar nenhum:
      só mostra o code para ser colado no Neko. Publique em qualquer host https
      e use a URL como ML_REDIRECT_URI.
    -->
    <h1>Código do Mercado Livre</h1>
    <p id="instructions">Copie o código e cole em Configurações → Mercado Livre, no Neko Studio.</p>
    <code id="code">—</code>
    <button id="copy" type="button">Copiar</button>
    <script>
      const code = new URLSearchParams(window.location.search).get('code');
      const codeElement = document.getElementById('code');
      if (code) {
        codeElement.textContent = code;
      } else {
        document.getElementById('instructions').textContent =
          'Nenhum código na URL. Volte ao Neko e clique em Conectar de novo.';
      }
      document.getElementById('copy').addEventListener('click', () => {
        if (code) void navigator.clipboard.writeText(code);
      });
    </script>
  </body>
</html>
